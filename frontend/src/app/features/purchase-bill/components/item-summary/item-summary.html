<section class="item-summary">
  <h3 class="item-summary__title">
    <mat-icon>summarize</mat-icon>
    Item Summary
  </h3>
  <dl class="item-summary__list">
    <div class="item-summary__row">
      <dt>Total Items</dt>
      <dd>{{ totalItems() }}</dd>
    </div>
    <div class="item-summary__row">
      <dt>Total Quantity</dt>
      <dd>{{ totalQuantity() }}</dd>
    </div>
  </dl>
</section>
